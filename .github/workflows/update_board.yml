name: Update MLB Board

on:
  # Every 20 min during MLB game hours (16:00-03:00 UTC = noon-11pm ET)
  # April through October
  schedule:
    - cron: '0,20,40 16-23 * 4-10 *'
    - cron: '0,20,40 0-3  * 4-10 *'

  # Manual trigger from the Actions tab
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: claude/mlb-mentions-scaffold-vCHET

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -e .

      - name: Run pipeline
        run: python -m app.static_gen

      - name: Commit index.html to branch root
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cp docs/index.html index.html
          cp docs/board.json board.json
          git add index.html board.json
          git diff --staged --quiet && echo "No changes." || \
            git commit -m "board $(date -u '+%Y-%m-%d %H:%M UTC') [skip ci]"
          git push

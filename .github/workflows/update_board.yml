name: Update MLB Board

on:
  # Run every 20 minutes during MLB game hours (16:00–03:00 UTC = noon–11pm ET)
  # April through October (MLB regular season + playoffs)
  schedule:
    - cron: '0,20,40 16-23 * 4-10 *'   # every 20 min, 16:00-23:59 UTC
    - cron: '0,20,40 0-3  * 4-10 *'    # every 20 min, 00:00-03:59 UTC

  # Allow manual trigger from the Actions tab
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -e .

      - name: Run pipeline → generate docs/index.html
        run: python -m app.static_gen

      - name: Commit and push updated board
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html docs/board.json
          # Only commit if there are actual changes
          git diff --staged --quiet && echo "No changes." || \
            git commit -m "chore: update board $(date -u '+%Y-%m-%d %H:%M UTC') [skip ci]"
          git push

name: Update MLB Board

on:
  # Run every 20 minutes during MLB game hours (16:00–03:00 UTC = noon–11pm ET)
  # April through October (MLB regular season + playoffs)
  schedule:
    - cron: '0,20,40 16-23 * 4-10 *'
    - cron: '0,20,40 0-3  * 4-10 *'

  # Manual trigger from the Actions tab
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -e .

      - name: Run pipeline → generate docs/index.html
        run: python -m app.static_gen

      # Push the docs/ output to the gh-pages branch (root).
      # GitHub Pages must be set to: branch=gh-pages, folder=/ (root).
      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          publish_branch: gh-pages
          commit_message: "board update ${{ github.run_number }} [skip ci]"
          keep_files: false
